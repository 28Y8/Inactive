name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both, because the demo code and the update feed override only exist in Debug.
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Inactive.slnx --configuration ${{ matrix.configuration }}

      - name: Test
        run: dotnet test --solution Inactive.slnx --configuration ${{ matrix.configuration }} --no-build
